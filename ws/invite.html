<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Play Word Slug 2</title>
  </head>
  <body>
    <h1>Word Slug 2</h1>
    <p id="status">Opening the app…</p>
    <p>
      <a href="https://apps.apple.com/app/word-slug-2/id6448659885">App Store</a>
      ·
      <a href="https://play.google.com/store/apps/details?id=com.alterededges.wordslug2">Google Play</a>
    </p>
    <script>
      (function () {
        var from = new URLSearchParams(window.location.search).get("from") || "";
        if (!from) {
          document.getElementById("status").textContent =
            "Install Word Slug 2, then ask your friend to send a new invite.";
          return;
        }
        window.location = "wordslug2://invite?from=" + encodeURIComponent(from);
      })();
    </script>
  </body>
</html>
